<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFM — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAFAF8; --surface: #FFFFFF; --ink: #0E0E0C; --ink-2: #2A2A26;
  --dim: #6E6E69; --border: #E8E7E2; --border-strong: #D6D5CF;
  --font: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #1a1a18; }
body { font-family: var(--font); color: var(--ink); font-size: 14px; -webkit-font-smoothing: antialiased; }
.shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 40px; max-width: 400px; width: 100%; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
}
.mark { width: 36px; height: 36px; background: var(--ink); border-radius: 6px;
  display: inline-grid; place-items: center; color: #FAFAF8;
  font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.3px; }
p { color: var(--dim); font-size: 13px; margin: 0 0 24px; }
a.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 6px;
  background: var(--ink); color: #FAFAF8; text-decoration: none;
  font-size: 14px; font-weight: 500; transition: background 0.1s;
}
a.btn:hover { background: var(--ink-2); }
.foot { margin-top: 20px; font-size: 12px; color: var(--dim); font-family: var(--mono); }
</style>
</head>
<body>
<div class="shell">
  <div class="card">
    <div class="mark">bf</div>
    <h1>Brain Fleet Management</h1>
    <p>Sign in with your Google account to manage your Pi clusters.</p>
    <a class="btn" href="/auth/google">Sign in with Google</a>
    <div class="foot">bfm.attlas.uk</div>
  </div>
</div>
</body>
</html>
