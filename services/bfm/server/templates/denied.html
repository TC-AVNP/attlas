<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFM — Access Denied</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #FAFAF8; --surface: #FFFFFF; --ink: #0E0E0C; --dim: #6E6E69;
  --border: #E8E7E2; --err: oklch(0.58 0.18 25);
  --font: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #1a1a18; }
body { font-family: var(--font); color: var(--ink); font-size: 14px; }
.shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 40px; max-width: 400px; width: 100%; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4); }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; color: var(--err); }
p { color: var(--dim); font-size: 13px; margin: 0 0 20px; }
a { color: var(--ink); font-size: 13px; }
</style>
</head>
<body>
<div class="shell">
  <div class="card">
    <h1>Access Denied</h1>
    <p>Your Google account is not authorized to access BFM.</p>
    <a href="/auth/google">Try a different account</a>
  </div>
</div>
</body>
</html>
