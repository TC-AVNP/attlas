<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchtower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c0c; --fg: #c0c0c0; --border: #333; --accent: #00ff00;
  --brand: #ff8700; --header: #ffff00; --muted: #8a8a8a; --surface: #1a1a1a;
  --danger: #ff5555; --warning: #ffcc00; --btn-on-accent: #000;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
[data-theme="light"] {
  --bg: #fafafa; --fg: #1a1a1a; --border: #e5e5e5; --accent: #007a00;
  --brand: #d56800; --header: #9a5200; --muted: #6b6b6b; --surface: #ffffff;
  --danger: #dc2626; --warning: #b45309; --btn-on-accent: #ffffff;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-ui); font-size: 15px; line-height: 1.6;
  background: var(--bg); color: var(--fg);
  max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem;
}
h1 {
  font-family: var(--font-mono); color: var(--brand); font-size: 1.8rem;
  font-weight: 600; margin-bottom: 1.5rem;
}
.stats-bar {
  display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 1rem 1.5rem; flex: 1; min-width: 140px;
}
.stat-value {
  font-family: var(--font-mono); font-size: 1.6rem; font-weight: 600;
  color: var(--accent);
}
.stat-label {
  font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin-top: 0.2rem;
}
.tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem;
}
.tab {
  font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 0.7rem 1.2rem; cursor: pointer;
  border: none; background: none; color: var(--muted);
  border-bottom: 2px solid transparent; transition: all 0.15s;
}
.tab:hover { color: var(--fg); }
.tab.active { color: var(--header); border-bottom-color: var(--header); }
.range-bar {
  display: flex; gap: 0.5rem; margin-bottom: 1rem;
}
.range-btn {
  font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase;
  padding: 0.35rem 0.8rem; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--border); background: none; color: var(--muted);
  transition: all 0.15s;
}
.range-btn:hover { color: var(--fg); border-color: var(--fg); }
.range-btn.active { color: var(--accent); border-color: var(--accent); }
.panel { display: none; }
.panel.active { display: block; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem;
}
.section-label {
  font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--header); margin-bottom: 1rem;
  padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
}
table { width: 100%; border-collapse: collapse; }
th {
  font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); text-align: left;
  padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border);
}
td {
  padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}
tr:last-child td { border-bottom: none; }
.email { color: var(--accent); font-family: var(--font-mono); font-size: 0.85rem; }
.app-tag {
  display: inline-block; font-family: var(--font-mono); font-size: 0.75rem;
  padding: 0.15rem 0.5rem; border-radius: 4px;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  color: var(--accent); margin-right: 0.3rem;
}
.live-dot {
  display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%;
  background: var(--accent); margin-right: 0.5rem;
  box-shadow: 0 0 4px var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
}
.time-ago { color: var(--muted); font-family: var(--font-mono); font-size: 0.8rem; }
.empty-state {
  text-align: center; padding: 3rem; color: var(--muted);
  font-family: var(--font-mono); font-size: 0.9rem;
}
.session-timeline { position: relative; padding-left: 1.5rem; }
.session-event {
  position: relative; padding: 0.4rem 0; font-size: 0.85rem;
}
.session-event::before {
  content: ''; position: absolute; left: -1.2rem; top: 0.65rem;
  width: 0.5rem; height: 0.5rem; border-radius: 50%;
  background: var(--accent); border: 1px solid var(--surface);
}
.session-event::after {
  content: ''; position: absolute; left: -0.95rem; top: 1.2rem;
  width: 1px; height: calc(100% - 0.4rem); background: var(--border);
}
.session-event:last-child::after { display: none; }
.clickable { cursor: pointer; }
.clickable:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }

.theme-toggle {
  position: fixed; top: 1rem; right: 1rem; width: 2.2rem; height: 2.2rem;
  border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
  color: var(--fg); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 1rem; z-index: 100;
}
.refresh-indicator {
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
  float: right; margin-top: 0.3rem;
}
@media (max-width: 640px) {
  body { padding: 1rem; }
  .stats-bar { flex-direction: column; }
  .heatmap-grid { overflow-x: auto; min-width: 600px; }
}
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme"></button>

<h1>Watchtower</h1>

<div class="tabs">
  <button class="tab active" data-panel="live">Live</button>
  <button class="tab" data-panel="users">Users</button>
</div>

<!-- Live panel -->
<div class="panel active" id="panel-live">
  <div class="section-label">Active now <span class="refresh-indicator" id="live-refresh"></span></div>
  <div class="card" id="live-content">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<!-- Users panel -->
<div class="panel" id="panel-users">
  <div class="range-bar" data-target="users">
    <button class="range-btn active" data-range="today">Today</button>
    <button class="range-btn" data-range="week">Week</button>
    <button class="range-btn" data-range="month">Month</button>
    <button class="range-btn" data-range="all">All time</button>
  </div>
  <div class="card" id="users-content">
    <div class="empty-state">Loading...</div>
  </div>
</div>

<!-- Level 2: User overview (per-app breakdown) -->
<div id="user-detail" style="display:none">
  <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem">
    <button class="range-btn" onclick="closeDetail()">&larr; Users</button>
    <span class="section-label" id="detail-title" style="border:none;margin:0;padding:0"></span>
  </div>
  <div class="range-bar" data-target="user-detail">
    <button class="range-btn active" data-range="today">Today</button>
    <button class="range-btn" data-range="week">Week</button>
    <button class="range-btn" data-range="month">Month</button>
    <button class="range-btn" data-range="all">All time</button>
  </div>
  <div class="stats-bar" id="user-stats"></div>
  <div class="card" id="user-apps-content"></div>
</div>

<!-- Level 3: App timeline (paginated page visits) -->
<div id="app-timeline" style="display:none">
  <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem">
    <button class="range-btn" onclick="closeTimeline()">&larr; Back</button>
    <span class="section-label" id="timeline-title" style="border:none;margin:0;padding:0"></span>
  </div>
  <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
    <button class="range-btn active" data-tl-range="today">Today</button>
    <button class="range-btn" data-tl-range="week">Week</button>
    <button class="range-btn" data-tl-range="month">Month</button>
    <button class="range-btn" data-tl-range="all">All time</button>
    <span style="color:var(--muted);margin:0 0.3rem">|</span>
    <label style="font-family:var(--font-mono);font-size:0.7rem;color:var(--muted)">From</label>
    <input type="date" id="tl-from" style="background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:0.3rem 0.5rem;font-family:var(--font-mono);font-size:0.8rem">
    <label style="font-family:var(--font-mono);font-size:0.7rem;color:var(--muted)">To</label>
    <input type="date" id="tl-to" style="background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:0.3rem 0.5rem;font-family:var(--font-mono);font-size:0.8rem">
    <button class="range-btn" id="tl-apply" style="color:var(--accent);border-color:var(--accent)">Apply</button>
  </div>
  <div class="card" id="timeline-content"></div>
  <div id="timeline-pagination" style="display:flex;gap:0.5rem;margin-top:1rem;justify-content:center;align-items:center"></div>
</div>

<script>
var BASE = {{.Base}};
var liveTimer = null;
var currentRange = { users: 'today' };

// Theme
function toggleTheme() {
  var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  updateThemeIcon();
}
function updateThemeIcon() {
  var btn = document.querySelector('.theme-toggle');
  btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '\u2600' : '\u263D';
}
(function() {
  var saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
})();

// Tabs
document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    tab.classList.add('active');
    var panel = tab.dataset.panel;
    document.getElementById('panel-' + panel).classList.add('active');
    document.getElementById('user-detail').style.display = 'none';
    document.getElementById('app-timeline').style.display = 'none';
    if (panel === 'live') startLiveRefresh();
    else stopLiveRefresh();
    if (!tabLoaded[panel]) {
      tabLoaded[panel] = true;
      if (panel === 'users') loadUsers();
    }
    pushHash(panel);
  });
});

// Range buttons
document.querySelectorAll('.range-bar').forEach(function(bar) {
  bar.querySelectorAll('.range-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      bar.querySelectorAll('.range-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var target = bar.dataset.target;
      currentRange[target] = btn.dataset.range;
      if (target === 'users') loadUsers();
    });
  });
});

// Helpers
function timeAgo(ms) {
  var sec = Math.floor((Date.now() - ms) / 1000);
  if (sec < 60) return sec + 's ago';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + 'm ago';
  var hr = Math.floor(min / 60);
  if (hr < 24) return hr + 'h ago';
  return Math.floor(hr / 24) + 'd ago';
}

function formatDuration(ms) {
  var sec = Math.floor(ms / 1000);
  if (sec < 60) return sec + 's';
  var min = Math.floor(sec / 60);
  if (min < 60) return min + 'm';
  var hr = Math.floor(min / 60);
  return hr + 'h ' + (min % 60) + 'm';
}

function shortEmail(email) {
  if (email === 'anonymous') return email;
  return email.split('@')[0];
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function api(path) {
  var res = await fetch(BASE + '/api/' + path);
  return res.json();
}

// Live
async function loadLive() {
  var d = await api('live');
  var el = document.getElementById('live-content');
  document.getElementById('live-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
  if (!d.users.length) {
    el.innerHTML = '<div class="empty-state">No active users in the last 5 minutes</div>';
    return;
  }
  var html = '<table><thead><tr><th></th><th>User</th><th>App</th><th>Page</th><th>Active for</th><th>Last seen</th></tr></thead><tbody>';
  d.users.forEach(function(u) {
    html += '<tr class="clickable" onclick="showUserDetail(\'' + escHtml(u.email) + '\')">';
    html += '<td><span class="live-dot"></span></td>';
    html += '<td class="email">' + escHtml(shortEmail(u.email)) + '</td>';
    html += '<td><span class="app-tag">' + escHtml(u.app) + '</span></td>';
    html += '<td style="color:var(--muted);font-size:0.85rem">' + escHtml(u.path) + '</td>';
    html += '<td class="time-ago">' + formatDuration(u.active_ms) + '</td>';
    html += '<td class="time-ago">' + timeAgo(u.last_seen) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function startLiveRefresh() {
  loadLive();
  stopLiveRefresh();
  liveTimer = setInterval(loadLive, 15000);
}
function stopLiveRefresh() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
}

// Pause polling when tab is hidden
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    stopLiveRefresh();
  } else if (document.querySelector('.tab.active').dataset.panel === 'live') {
    startLiveRefresh();
  }
});

// Users
async function loadUsers() {
  var d = await api('users?range=' + currentRange.users);
  var el = document.getElementById('users-content');
  if (!d.users.length) {
    el.innerHTML = '<div class="empty-state">No data for this period</div>';
    return;
  }
  var html = '<table><thead><tr><th>User</th><th>Apps</th><th>Page views</th><th>Est. time</th><th>Last seen</th></tr></thead><tbody>';
  d.users.forEach(function(u) {
    html += '<tr class="clickable" onclick="showUserDetail(\'' + escHtml(u.email) + '\')">';
    html += '<td class="email">' + escHtml(shortEmail(u.email)) + '</td>';
    html += '<td>' + u.app_count + '</td>';
    html += '<td>' + u.events + '</td>';
    html += '<td class="time-ago">' + u.est_minutes + 'm</td>';
    html += '<td class="time-ago">' + timeAgo(u.last_seen) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

// --- Level 2: User overview ---
var currentDetailEmail = '';
var currentDetailRange = 'today';

async function showUserDetail(email, range) {
  currentDetailEmail = email;
  if (range) currentDetailRange = range;
  pushHash('user/' + encodeURIComponent(email) + '/' + currentDetailRange);
  stopLiveRefresh();
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('app-timeline').style.display = 'none';
  var detail = document.getElementById('user-detail');
  detail.style.display = 'block';
  document.getElementById('detail-title').textContent = email;

  // Sync range buttons
  detail.querySelectorAll('.range-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.range === currentDetailRange);
  });

  var d = await api('user/' + encodeURIComponent(email) + '?range=' + currentDetailRange);

  // Stats bar
  document.getElementById('user-stats').innerHTML =
    '<div class="stat-card"><div class="stat-value">' + d.total_minutes + 'm</div><div class="stat-label">Active time</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + d.total_apps + '</div><div class="stat-label">Apps</div></div>' +
    '<div class="stat-card"><div class="stat-value">' + (d.last_seen ? timeAgo(d.last_seen) : '-') + '</div><div class="stat-label">Last seen</div></div>';

  // Per-app breakdown
  var el = document.getElementById('user-apps-content');
  if (!d.apps.length) {
    el.innerHTML = '<div class="empty-state">No activity for this period</div>';
    return;
  }
  var maxMin = Math.max.apply(null, d.apps.map(function(a) { return a.est_minutes; }));
  var html = '<table><thead><tr><th>App</th><th>Pages</th><th>Time</th><th></th></tr></thead><tbody>';
  d.apps.forEach(function(a) {
    var pct = maxMin > 0 ? (a.est_minutes / maxMin * 100) : 0;
    html += '<tr class="clickable" onclick="showAppTimeline(\'' + escHtml(currentDetailEmail) + '\',\'' + escHtml(a.app) + '\')">';
    html += '<td><span class="app-tag">' + escHtml(a.app) + '</span></td>';
    html += '<td>' + a.page_views + '</td>';
    html += '<td class="time-ago">' + a.est_minutes + 'm</td>';
    html += '<td style="width:50%"><div style="height:6px;border-radius:3px;background:var(--border)">';
    html += '<div style="height:100%;width:' + pct + '%;border-radius:3px;background:var(--accent)"></div>';
    html += '</div></td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

// Wire up Level 2 range buttons
document.querySelector('#user-detail .range-bar').querySelectorAll('.range-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelector('#user-detail .range-bar').querySelectorAll('.range-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentDetailRange = btn.dataset.range;
    showUserDetail(currentDetailEmail, currentDetailRange);
  });
});

function closeDetail() {
  document.getElementById('user-detail').style.display = 'none';
  document.getElementById('app-timeline').style.display = 'none';
  pushHash('users');
  navigateToHash('#users');
}

// --- Level 3: App timeline ---
var currentTimelineApp = '';
var currentTimelineRange = 'today';
var currentTimelinePage = 1;

async function showAppTimeline(email, app, page, range) {
  currentTimelineApp = app;
  if (range) currentTimelineRange = range;
  currentTimelinePage = page || 1;
  pushHash('user/' + encodeURIComponent(email) + '/app/' + encodeURIComponent(app) + '/' + currentTimelineRange + '/' + currentTimelinePage);
  document.getElementById('user-detail').style.display = 'none';
  var tl = document.getElementById('app-timeline');
  tl.style.display = 'block';
  document.getElementById('timeline-title').textContent = email + ' \u2192 ' + app;

  // Sync range buttons
  tl.querySelectorAll('.range-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.range === currentTimelineRange);
  });

  var url = 'user/' + encodeURIComponent(email) + '/app/' + encodeURIComponent(app) +
    '?range=' + currentTimelineRange + '&page=' + currentTimelinePage;
  if (tlUntil) url += '&until=' + tlUntil;
  var d = await api(url);

  var el = document.getElementById('timeline-content');
  if (!d.events.length) {
    el.innerHTML = '<div class="empty-state">No page visits for this period</div>';
    document.getElementById('timeline-pagination').innerHTML = '';
    return;
  }

  // Group by day
  var days = {};
  d.events.forEach(function(ev) {
    var day = new Date(ev.timestamp).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
    if (!days[day]) days[day] = [];
    days[day].push(ev);
  });

  var html = '';
  Object.keys(days).forEach(function(day) {
    html += '<div class="section-label" style="margin-top:1rem">' + escHtml(day) + '</div>';
    html += '<table><thead><tr><th>Time</th><th>Page</th><th>Duration</th></tr></thead><tbody>';
    days[day].forEach(function(ev) {
      var time = new Date(ev.timestamp).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      var dur = ev.duration_ms > 0 ? formatDuration(ev.duration_ms) : '-';
      html += '<tr>';
      html += '<td class="time-ago">' + time + '</td>';
      html += '<td style="font-size:0.9rem">' + escHtml(ev.path) + '</td>';
      html += '<td class="time-ago">' + dur + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  });
  el.innerHTML = html;

  // Pagination — always show
  var pag = document.getElementById('timeline-pagination');
  var ph = '<span class="time-ago">' + d.total + ' visits</span>';
  if (d.pages > 1) {
    ph += '<span style="color:var(--border);margin:0 0.3rem">|</span>';
    if (d.page > 1) {
      ph += '<button class="range-btn" onclick="showAppTimeline(\'' + escHtml(email) + '\',\'' + escHtml(app) + '\',' + (d.page - 1) + ')">&larr; Prev</button>';
    }
    ph += '<span class="time-ago">Page ' + d.page + ' of ' + d.pages + '</span>';
    if (d.page < d.pages) {
      ph += '<button class="range-btn" onclick="showAppTimeline(\'' + escHtml(email) + '\',\'' + escHtml(app) + '\',' + (d.page + 1) + ')">Next &rarr;</button>';
    }
  }
  pag.innerHTML = ph;
}

// Wire up Level 3 range buttons + date pickers
var tlUntil = '';
document.querySelectorAll('[data-tl-range]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-tl-range]').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentTimelineRange = btn.dataset.tlRange;
    tlUntil = '';
    document.getElementById('tl-from').value = '';
    document.getElementById('tl-to').value = '';
    showAppTimeline(currentDetailEmail, currentTimelineApp, 1, currentTimelineRange);
  });
});
document.getElementById('tl-apply').addEventListener('click', function() {
  var from = document.getElementById('tl-from').value;
  var to = document.getElementById('tl-to').value;
  if (from) {
    document.querySelectorAll('[data-tl-range]').forEach(function(b) { b.classList.remove('active'); });
    currentTimelineRange = from;
    tlUntil = to || '';
    showAppTimeline(currentDetailEmail, currentTimelineApp, 1, currentTimelineRange);
  }
});

function closeTimeline() {
  document.getElementById('app-timeline').style.display = 'none';
  showUserDetail(currentDetailEmail, currentDetailRange);
  // pushHash handled by showUserDetail
}

var tabLoaded = { live: false, users: false };

// --- Hash routing ---
// Formats:
//   #live, #apps, #users, #heatmap                        (tabs)
//   #user/<email>/<range>                                  (level 2)
//   #user/<email>/app/<app>/<range>/<page>                 (level 3)

function pushHash(hash) {
  if (location.hash !== '#' + hash) {
    history.pushState(null, '', '#' + hash);
  }
}

function navigateToHash(hash) {
  var parts = (hash || '').replace(/^#/, '').split('/');
  if (!parts[0]) parts = ['live'];

  if (parts[0] === 'user' && parts.length >= 3 && parts[2] === 'app' && parts.length >= 5) {
    // Level 3: #user/email/app/appname/range/page
    var email = decodeURIComponent(parts[1]);
    var app = decodeURIComponent(parts[3]);
    var range = parts[4] || 'today';
    var page = parseInt(parts[5]) || 1;
    currentDetailEmail = email;
    currentDetailRange = range;
    currentTimelineRange = range;
    showAppTimeline(email, app, page, range);
    return;
  }

  if (parts[0] === 'user' && parts.length >= 2) {
    // Level 2: #user/email/range
    var email = decodeURIComponent(parts[1]);
    var range = parts[2] || 'today';
    showUserDetail(email, range);
    return;
  }

  var tab = parts[0];
  var validTabs = ['live', 'users'];
  if (validTabs.indexOf(tab) === -1) tab = 'live';

  document.getElementById('user-detail').style.display = 'none';
  document.getElementById('app-timeline').style.display = 'none';
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  var tabEl = document.querySelector('.tab[data-panel="' + tab + '"]');
  if (tabEl) tabEl.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'live') startLiveRefresh();
  else stopLiveRefresh();
  if (!tabLoaded[tab]) {
    tabLoaded[tab] = true;
    if (tab === 'live') loadLive();
    else if (tab === 'apps') loadApps();
    else if (tab === 'users') loadUsers();
    else if (tab === 'heatmap') loadHeatmap();
  }
}

window.addEventListener('popstate', function() { navigateToHash(location.hash); });

// Init
loadStats();
navigateToHash(location.hash);
</script>
